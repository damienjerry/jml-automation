name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This job is the reason the repository can be public. It runs before anything
  # else and blocks any commit that carries a credential or a real organisation
  # identifier, so hand-sanitising is never the last line of defence.
  disclosure-gate:
    name: Secret and identifier gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the working tree

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan working tree for organisation identifiers
        run: node tools/lint/check-identifiers.mjs

  build:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    needs: disclosure-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Every workflow file the toolkit ships must be importable and free of the
  # instance-specific metadata n8n writes into an export (credential ids, node
  # uuids, staticData holding real people).
  workflows:
    name: Validate n8n workflow bundle
    runs-on: ubuntu-latest
    needs: disclosure-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate exports
        run: npm run validate:workflows

  # The installer, run for real on Linux the way a person would: clone this
  # commit, install, build, then walk the whole setup preview to its last line
  # in a pseudo-terminal. The preview acts on nothing and keeps nothing, so
  # this needs no credential.
  installer-linux:
    name: Installer and setup preview on Linux
    runs-on: ubuntu-latest
    needs: disclosure-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Shellcheck the installer
        run: shellcheck install.sh

      - name: Dry run
        run: JML_REPO_URL="file://$GITHUB_WORKSPACE" JML_DIR="$RUNNER_TEMP/jml-dry" JML_REF="$GITHUB_SHA" ./install.sh --dry-run

      - name: Install, build, and walk the setup preview
        run: JML_REPO_URL="file://$GITHUB_WORKSPACE" JML_DIR="$RUNNER_TEMP/jml" JML_REF="$GITHUB_SHA" python3 tools/ci/drive-preview.py -- ./install.sh --yes --preview

  # There is no Windows installer, and the supported route is WSL2, which is
  # Linux. This job keeps the code itself working on native Windows: its first
  # run found four real defects. It blocks, so Windows cannot quietly regress.
  windows:
    name: Test suite on native Windows
    runs-on: windows-latest
    needs: disclosure-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
